<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedra papel tesoura</title>
  <link rel="stylesheet" href="style.css">  
</head>
<body>
  <header>
    <h1>Pedra papel tesoura</h1>
  </header>
  <main>
    <h2>Jogue contra o computador</h2>
    <p id="resultado">Escolha entre pedra, papel ou tesoura e veja quem ganha!</p>
    <div class="resultados-container">
      <div class="resultado">
        <div class="player-name">JOGADOR</div>
        <div class="image-player-choseen">
          <img id="imagem-jogador" src="images/question.png" width="200px">
        </div>
      </div>
      <div class="resultado">
        <div class="computer-name">COMPUTADOR</div>
        <div class="image-computer-choseen">
          <img id="imagem-computador" src="images/question.png" width="200px">
        </div>
      </div>
    </div>

    <h1>Human score: <span id="human-score"></span></h1>
    <h1>Computer score: <span id="computer-score"></span></h1>
    <div class="barra">
    </div>
    <div class="footer">
      <div class="buttons">
        <div id="jogue-pedra">PEDRA</div>
        <div id="jogue-papel">PAPEL</div>
        <div id="jogue-tesoura">TESOURA</div>
      </div>
    </div>


  </main>
  <script src="javascript.js"></script>
</body>
</html>
